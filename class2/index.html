const KEY='learn2_v1',BACK='learn2_v1_backup';let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!state)try{state=JSON.parse(localStorage.getItem(BACK)||'null')}catch(e){}state=state||{attempts:0,correct:0,done:{},errors:{},variant:{},history:[],last:'m-add',review:{},studyMs:0};state.done=state.done||{};state.errors=state.errors||{};state.variant=state.variant||{};state.history=state.history||[];state.review=state.review||{};state.studyMs=state.studyMs||0;let tick=Date.now();

const $=x=>document.getElementById(x);function hide(){['home','course','today','parent'].forEach(x=>$(x).classList.add('hidden'))}function home(){hide();$('home').classList.remove('hidden');render()}function pct(id){return Math.round(new Set(state.done[id]||[]).size/6*100)}function subjPct(s){let a=modules.filter(x=>x.s===s);return Math.round(a.reduce((z,m)=>z+pct(m.id),0)/a.length)}function normalize(x){return String(x??'').trim().toLocaleLowerCase('uk-UA').replace(/[’']/g,"'")}
function render(){let overall=Math.round(modules.reduce((z,m)=>z+pct(m.id),0)/modules.length);$('allBar').style.width=overall+'%';$('allText').textContent=overall+'% курсу опрацьовано';let lm=modules.find(x=>x.id===state.last);$('continueTitle').textContent=lm?lm.title:'Почнімо';$('subjects').innerHTML=['math','ukr','eng','read','world','digital','art','health'].map(s=>'<div class="subject"><b>'+names[s]+'</b><p>'+subjPct(s)+'%</p><div class="bar"><i style="width:'+subjPct(s)+'%"></i></div><br><button onclick="openFirst(\''+s+'\')">Вчитися</button></div>').join('');$('route').innerHTML=modules.map(m=>'<div class="module"><b>'+names[m.s]+' · '+m.title+'</b><div class="bar"><i style="width:'+pct(m.id)+'%"></i></div><span class="small">'+pct(m.id)+'%</span></div>').join('')}
function openFirst(s){openLesson(modules.find(m=>m.s===s).id)}function continueLearning(){openLesson(state.last||'m-add')}
function openLesson(id){let m=modules.find(x=>x.id===id);if(!m)return;state.last=id;persist();hide();$('course').classList.remove('hidden');let v=(state.variant[id]||0)%6,t=B[m.kind][v],ans=t[0],q=t[1];$('side').innerHTML=modules.map(x=>'<button onclick="openLesson(\''+x.id+'\')">'+names[x.s]+'<br><small>'+x.title+' · '+pct(x.id)+'%</small></button>').join('');$('lesson').innerHTML='<div class="card"><span class="pill">'+names[m.s]+'</span><div class="hero"><h2>'+m.title+'</h2><p>'+m.theory+'</p></div><div class="theory"><b>Пояснення до цього типу задачі</b><p>'+explain(m.kind)+'</p></div><div class="question"><b>Задача '+(v+1)+' з 6</b><h3>'+q+'</h3><div class="answer"><input id="ans" autocomplete="off" inputmode="'+(typeof ans==='number'?'decimal':'text')+'" placeholder="Твоя відповідь"><button onclick="check(\''+id+'\')">Перевірити</button></div><div id="fb"></div><div id="rv"></div></div><button class="secondary" onclick="nextVariant(\''+id+'\')">Інша задача</button></div>'}

function check(id){let m=modules.find(x=>x.id===id),v=(state.variant[id]||0)%6,t=B[m.kind][v],got=$('ans').value,ok=typeof t[0]==='number'?Math.abs(Number(got.replace(',','.'))-t[0])<.001:normalize(got)===normalize(t[0]);state.attempts++;if(ok){state.correct++;state.done[id]=state.done[id]||[];if(!state.done[id].includes(String(v)))state.done[id].push(String(v));$('fb').className='feedback ok';$('fb').innerHTML='✓ Правильно. Самостійна відповідь зарахована.';$('rv').innerHTML='';state.review[id]=Date.now()+3*86400000}else{state.errors[id]=(state.errors[id]||0)+1;$('fb').className='feedback bad';$('fb').innerHTML='✗ Відповідь поки не підходить. Перевір, який крок або поняття ти використав.';$('rv').className='review';$('rv').innerHTML='<b>Що повторити:</b> '+m.theory+'<br><br>Готової відповіді не показуємо. Повернись до правила й спробуй самостійно.';state.review[id]=Date.now()+86400000}state.history.push({id,ok,v,t:Date.now()});if(state.history.length>500)state.history=state.history.slice(-500);save()}
function nextVariant(id){let done=state.done[id]||[],cur=(state.variant[id]||0)%6,n=-1;for(let k=1;k<=6;k++){let x=(cur+k)%6;if(!done.includes(String(x))){n=x;break}}state.variant[id]=n<0?(cur+1)%6:n;save();openLesson(id)}
function today(){hide();$('today').classList.remove('hidden');let due=modules.filter(m=>(state.review[m.id]||Infinity)<=Date.now()).sort((a,b)=>(state.errors[b.id]||0)-(state.errors[a.id]||0)).slice(0,2),next=modules.find(m=>pct(m.id)<100)||modules[0];$('todayContent').innerHTML='<div class="module"><b>1. Основна тема: '+next.title+'</b><br><button onclick="openLesson(\''+next.id+'\')">Почати</button></div>'+due.map((m,i)=>'<div class="module"><b>'+(i+2)+'. Повторення: '+m.title+'</b><br><button class="secondary" onclick="openLesson(\''+m.id+'\')">Повторити</button></div>').join('')}

function exportProgress(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='class2-progress.json';a.click()}function importProgress(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.history)throw 0;state=x;save();alert('Прогрес імпортовано')}catch(e){alert('Неправильний файл')}};r.readAsText(i.files[0])};i.click()}function resetProgress(){if(!confirm('Скинути весь прогрес?'))return;if(!confirm('Точно почати з нуля?'))return;localStorage.removeItem(KEY);localStorage.removeItem(BACK);location.reload()}render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
